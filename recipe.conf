# GLM-5.3-Flash EXL3 4bpw on two DGX Sparks with patched TensorFold (engine-patches/) at TP=2.
# run.sh and stop.sh source this file. Every value is a default: a variable already set in the environment wins.

# The pack, pinned: the commit, its shard count and the shards' total bytes. run.sh checks the snapshot against them.
MODEL=${MODEL:-sfxnz/GLM-5.3-Flash-EXL3-4bpw}
REVISION=${REVISION:-d75e26a4fedfdb0e9a7d2422afd9cdba926ca7e6}
SHARDS=${SHARDS:-120}
SHARD_BYTES=${SHARD_BYTES:-175642102880}
# Each pattern becomes its own `hf download --include` (one flag per pattern, or hf reads the rest as file names).
HF_INCLUDE=${HF_INCLUDE:-*.safetensors *.json *.jinja LICENSE}
# The same absolute path on both nodes: the worker's copy lands at the head's path.
HF_CACHE=${HF_CACHE:-$HOME/.cache/huggingface}

# The engine. TF_VERSION and TF_SHA256 match the runtime base image (docker/Dockerfile); IMAGE is overlaid with
# engine-patches/ via docker/Dockerfile.patched (see README.md).
IMAGE=${IMAGE:-tf-glm53:1.3.0-v6m4}
TF_VERSION=${TF_VERSION:-1.2.10}
TF_SHA256=${TF_SHA256:-c335c44f81d55847a5f81d74a94ac3d09f81bd6688247cff972cf1f63fc18105}

# What clients see.
SERVED_NAME=${SERVED_NAME:-glm-5.3-flash}
PORT=${PORT:-8000}
# One request's cap. With TF_KV_PAGES=on --kv-cache fp8 TF_GLM_KV_SHARD=1, both Sparks split E4M3 KV latents across
# ranks, yielding 5,984 to 7,809 pages of 512 rows (~3.06M to 4.00M tokens: 5 to 7 x 524K windows resident at once
# alongside KV_SHARE=16). Drop PARALLEL=8 for C8 workloads (still 6,776 pages = 3.47M tokens).
CONTEXT=${CONTEXT:-524288}
PARALLEL=${PARALLEL:-4}
# Dense linears and LM head packed to symmetric 8-bit on GPU at load (TF_GLM_FAST_LOAD=1): +0.00037 nats/token NLL vs
# BF16 (within the 0.002 gate; evidence/opt-v4/gates/results/V6-m4/nll.verdict).
DENSE_BITS=${DENSE_BITS:-8}
HEAD_BITS=${HEAD_BITS:-8}
# Memory each Spark keeps for the host (engine default is 12.2).
MEMORY_RESERVE_GIB=${MEMORY_RESERVE_GIB:-10.5}
# TF_GLM_INDEX_CUDA=1 runs DSA indexer scores/pools in TensorFold's CUDA kernels (with TF_GLM_INDEX_SPLIT=32768).
INDEX_CUDA=${INDEX_CUDA:-1}
# Rows each stream sets aside for video frames (64 to 262144). Image has no libtfvideo; 64 saves 128 MiB/stream.
VIDEO_TOKENS=${VIDEO_TOKENS:-64}
# TF_KV_SHARE=16 keeps up to 16 prompt states as zero-copy sharded KV pages across both ranks' per-part radix stores.
# Verified on G5 4x500K soak (4/4 Turn-2 resumes in 1.6-6.1s) and G6 agents (12/12 C4 in 1.59s, 405K in 2.61s).
KV_SHARE=${KV_SHARE:-16}
# --prompt-cache-gib: empty leaves the engine's own split.
PROMPT_CACHE_GIB=${PROMPT_CACHE_GIB:-}
# An absolute path to a key file (one key a line, mode 600) at the same path on both nodes; empty serves without keys.
API_KEY_FILE=${API_KEY_FILE:-}
# Docker volume on each node at /root/.cache/tensorfold for shard sha256 cache (38 s warm boot with TF_GLM_FAST_LOAD=1).
ENGINE_CACHE=${ENGINE_CACHE-tf-glm53-cache-1210}
# DFlash2 drafter (fetched separately by the user into HF_CACHE on both nodes; run.sh never downloads it).
# Required by TF_GLM_KV_SHARD=1 (target MTP head drafting is refused with sharded KV).
DRAFTER=${DRAFTER:-incoai/GLM-5.3-Flash-DFlash2}
DRAFTER_REVISION=${DRAFTER_REVISION:-7d74cdd881ed7e32c31175984a67823127b66cfe}
DRAFTER_BITS=${DRAFTER_BITS:-4}
# Qualified V6-m4 engine flags: sharded FP8 paged KV, tensor-core MLA prefill (ABSORB_MMA), 4096 solo prefill chunks,
# parallel GPU load (FAST_LOAD), TP-split DFlash2 (DRAFT_ONLY_HEAD + DRAFT_DOWN8), decode fusions (MOE_DIRECT + DSCORES
# + L2PF + classic), lone/drafter CUDA graphs (SHARED_GRAPHS=0 keeps zero swapout on GB10), and 1 MiB NCCL LL/Simple.
EXTRA_ENV=${EXTRA_ENV:-TF_KV_PAGES=on TF_GLM_KV_SHARD=1 TF_GLM_KV_LIVE_HALF=1 TF_GLM_DRAFT_ONLY_HEAD=1 TF_GLM_ABSORB_MMA=1 TF_GLM_CHUNK_SOLO=4096 TF_GLM_SLOTS_BF16=0 TF_GLM_FAST_LOAD=1 TF_GLM_DRAFT_DOWN8=1 TF_GLM_MOE_DIRECT=1 TF_GLM_DSCORES=1 TF_GLM_L2PF=1 TF_GLM_INDEX_SPLIT=32768 TF_GLM_EXPERT_FORM=classic TF_GLM_GRAPHS=1 TF_GLM_GRAPH_TAPS=1 TF_GLM_DRAFT_GRAPHS=1 TF_GLM_SHARED_GRAPHS=0 TF_GLM_GRAPH_MAX=32 NCCL_BUFFSIZE=1048576 NCCL_PROTO=LL,Simple}
EXTRA_ARGS=${EXTRA_ARGS:---kv-cache fp8}

# The pair. The head is the machine running run.sh (rank 0, HTTP); WORKER is its ssh name (rank 1).
WORKER=${WORKER:-spark2}
IFACE=${IFACE:-enp1s0f1np1}
# Empty means read from IFACE on each node.
HEAD_IP=${HEAD_IP:-}
WORKER_IP=${WORKER_IP:-}
HCA=${HCA:-rocep1s0f1,roceP2p1s0f1}
ROCE_HCA=${ROCE_HCA:-rocep1s0f1,roceP2p1s0f1}
# Rank 0 listens here; the liveness line takes NCCL_PORT+1.
NCCL_PORT=${NCCL_PORT:-29583}

# Gates.
MEM_GATE_GIB=${MEM_GATE_GIB:-109}
# FORCE=1 starts below the memory gate, after printing it.
FORCE=${FORCE:-0}
READY_TIMEOUT=${READY_TIMEOUT:-1200}

# Ours. run.sh and stop.sh stop or remove only containers with this label and these names.
LABEL=ai-lab.recipe=glm53-exl3-tensorfold
NAME_PREFIX=tf-glm53-rank
