# GLM-5.3-Flash EXL3 4bpw on two DGX Sparks with TensorFold 1.2.5 at TP=2. run.sh and stop.sh source this file.
# Every value is a default: a variable already set in the environment wins (REVISION=... ./run.sh).

# The pack, pinned: the commit, its shard count and the shards' total bytes. run.sh checks the snapshot against them.
MODEL=${MODEL:-sfxnz/GLM-5.3-Flash-EXL3-4bpw}
REVISION=${REVISION:-d75e26a4fedfdb0e9a7d2422afd9cdba926ca7e6}
SHARDS=${SHARDS:-120}
SHARD_BYTES=${SHARD_BYTES:-175642102880}
# Each pattern becomes its own `hf download --include` (one flag per pattern, or hf reads the rest as file names).
HF_INCLUDE=${HF_INCLUDE:-*.safetensors *.json *.jinja LICENSE}
# The same absolute path on both nodes: the worker's copy lands at the head's path.
HF_CACHE=${HF_CACHE:-$HOME/.cache/huggingface}

# The engine. TF_VERSION and TF_SHA256 match the ARG defaults in docker/Dockerfile and the labels on the image.
IMAGE=${IMAGE:-tf-glm53:1.2.5}
TF_VERSION=${TF_VERSION:-1.2.5}
TF_SHA256=${TF_SHA256:-1a0192b28d6ab6ec2749f3ff25515379dba4895171e781b30f810afc971ae4f8}

# What clients see.
SERVED_NAME=${SERVED_NAME:-glm-5.3-flash}
PORT=${PORT:-8000}
# One request's cap. The streams share one pool of KV pages (2,056 pages, ~1.05M tokens per rank with the settings
# below), so a 1M request has the pool to itself while it runs. Measured in evidence/knobs/d8h8-p8-1m-r105/.
CONTEXT=${CONTEXT:-1048576}
PARALLEL=${PARALLEL:-8}
# The dense linears and the head are packed to 8 bits at load (16 keeps them BF16): +0.0003 nats/token NLL, within the
# 0.002 gate; 4 bits failed it (+0.040). It frees ~3.8 GiB per rank for KV pages. evidence/knobs/.
DENSE_BITS=${DENSE_BITS:-8}
HEAD_BITS=${HEAD_BITS:-8}
# The engine keeps this much of each Spark's memory for the host (its default is 12.2). 10.5 fits the 1M window beside
# 8 streams; host MemAvailable stayed >= 10.4 GiB across the bench and the 1M needle.
MEMORY_RESERVE_GIB=${MEMORY_RESERVE_GIB:-10.5}

# The pair. The head is the machine running run.sh (rank 0, HTTP); WORKER is its ssh name (rank 1).
WORKER=${WORKER:-spark2}
IFACE=${IFACE:-enp1s0f1np1}
# Empty means read from IFACE on each node.
HEAD_IP=${HEAD_IP:-}
WORKER_IP=${WORKER_IP:-}
HCA=${HCA:-rocep1s0f1,roceP2p1s0f1}
ROCE_HCA=${ROCE_HCA:-rocep1s0f1}
# Rank 0 listens here; the liveness line takes NCCL_PORT+1.
NCCL_PORT=${NCCL_PORT:-29583}

# Gates.
# MemAvailable each node must show before load: 82.9 GiB of weights per rank + 12.8 GiB KV pages + 2.4 GiB for the
# other 7 streams + the 10.5 GiB reserve = 108.6; the boots that served had 115-118.
MEM_GATE_GIB=${MEM_GATE_GIB:-109}
# FORCE=1 starts below the memory gate, after printing it.
FORCE=${FORCE:-0}
READY_TIMEOUT=${READY_TIMEOUT:-1200}

# Ours. run.sh and stop.sh stop or remove only containers with this label and these names.
LABEL=ai-lab.recipe=glm53-exl3-tensorfold
NAME_PREFIX=tf-glm53-rank
